[project]
name = "data-processing-agent"
version = "0.1.0"
description = "通用数据处理智能体 - 覆盖数据全生命周期：采集→清洗→集成→治理→分析→资产化→服务"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Data Processing Agent Team" }
]

dependencies = [
    # 核心依赖
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    
    # 数据处理
    "pandas>=2.0",
    "pyarrow>=14.0",
    "duckdb>=0.9.0",
    
    # Web 框架（API 服务）
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    
    # 文件格式
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    
    # 工具
    "python-dateutil>=2.8.0",
    "tqdm>=4.66.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "black>=24.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

all = [
    "dbt-duckdb>=1.7.0",
    "openmetadata-ingestion>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-v",
    "--strict-markers",
    "-n", "auto",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
